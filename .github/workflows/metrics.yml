name: Profile metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # GITHUB_TOKEN covers public data out of the box.
          # To include private-repo contributions in the counts, create a
          # classic PAT with `repo` + `read:user` scopes, save it as a repo
          # secret named METRICS_TOKEN, and swap the line below for:
          #   token: ${{ secrets.METRICS_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}

          committer_branch: metrics
          committer_message: "chore(metrics): update profile SVG [skip ci]"
          filename: github-metrics.svg

          template: classic
          base: header, activity
          config_timezone: America/Sao_Paulo
          config_display: large
          config_animations: no

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 6
          plugin_languages_threshold: 2%
          plugin_languages_details: percentage
